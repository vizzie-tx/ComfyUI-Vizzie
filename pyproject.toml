[project]
name = "comfyui-vizzie"
version = "0.0.1"
description = "Custom controls for easy control panel construction"
authors = [
  {name = "ComfyUI-Vizzie", email = "vizzie@flamingpackets.net"}
]
readme = "README.md"
license = "MIT"
license-files = [ "LICENSE" ]
requires-python = ">=3.10"
classifiers = ["Operating System :: OS Independent"]
dependencies = []

[project.urls]
Repository = "https://github.com/vizzie-tx/ComfyUI-Vizzie"

[tool.comfy]
PublisherId = "vizzie-tx"
DisplayName = "Vizzie Nodes"

[tool.mypy]
files = "."

# Use strict defaults
strict = true
warn_unreachable = true
warn_no_return = true

[[tool.mypy.overrides]]
# Don't require test functions to include types
module = "tests.*"
allow_untyped_defs = true
disable_error_code = "attr-defined"

[tool.ruff]
line-length = 140

# Add rules to ban exec/eval
[tool.ruff.lint]
select = [
    "S102",  # exec-builtin
    "S307",  # eval-used
    "W293",
    "F",  # The "F" series in Ruff stands for "Pyflakes" rules, which catch various Python syntax errors and undefined names.
    # See all rules here: https://docs.astral.sh/ruff/rules/#pyflakes-f
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
