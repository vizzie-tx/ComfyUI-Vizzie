name: Lint and test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Ruff
        run: python -m pip install ruff==0.15.13
      - name: Lint Python
        run: ruff check .
      - name: Test Python nodes
        run: python -m unittest discover -s tests
      - name: Test frontend controls
        run: node tests/numeric_controls.test.mjs
